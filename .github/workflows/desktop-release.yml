# Desktop app packaging: four-target matrix building the Electron shell over
# each runner's native platform (optional platform packages — sharp, ripgrep,
# claude-agent-sdk, landlock-run — install per-host, so cross-building is
# deliberately not attempted). Pushing a desktop-v* tag publishes installers
# and the electron-updater feed to a GitHub Release; other runs upload
# workflow artifacts only. Signing/notarization activates when the CSC_*/
# APPLE_* secrets exist and is skipped (unsigned build) when they don't.
name: desktop-release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # electron-builder creates a draft release when none matches the version tag;
  # four legs racing that create produced split-brain duplicate drafts. Create
  # the draft up front so every leg appends to the same release.
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "v${version}" --repo "$GITHUB_REPOSITORY" --draft --title "$version" --target "$GITHUB_SHA"
  build:
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # darwin arm64
          - os: macos-13 # darwin x64 (Intel)
          - os: windows-2022 # win32 x64
          - os: ubuntu-22.04 # linux x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build repo artifacts
        run: pnpm run build
      - name: Install desktop workspace
        run: pnpm -C desktop install --frozen-lockfile
      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization (all optional).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing (optional).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm -C desktop run package -- --skip-build --publish ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'always' || 'never' }}
      - name: Upload artifacts (non-release runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
          if-no-files-found: error
