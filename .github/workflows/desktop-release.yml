# Desktop app packaging: one leg per target, each building on a runner whose
# host IS that target. The runtime closure pulls architecture-locked platform
# packages (sharp + its libvips, koffi, ripgrep, node-addon-require-builtin)
# that the installer selects from the host, so cross-building would stage the
# wrong binaries; native legs also let prepare-runtime run the staged CLI under
# the staged Node as a real smoke test. macOS ships two arches, and because
# macOS has no arch-suffixed update feed, both legs write a competing
# latest-mac.yml — merge-mac-feed reconciles them after the matrix completes.
# Pushing a desktop-v* tag publishes installers and the electron-updater feed
# to a GitHub Release; other runs upload workflow artifacts only.
# Signing/notarization activates when the CSC_*/APPLE_* secrets exist and is
# skipped (unsigned build) when they don't.
name: desktop-release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # electron-builder creates a draft release when none matches the version tag;
  # four legs racing that create produced split-brain duplicate drafts. Create
  # the draft up front so every leg appends to the same release.
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "v${version}" --repo "$GITHUB_REPOSITORY" --draft --title "$version" --target "$GITHUB_SHA"
  build:
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # darwin arm64
          - os: macos-15-intel # darwin x64; GitHub's last x86_64 macOS image
          - os: windows-2022 # win32 x64
          - os: ubuntu-22.04 # linux x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build repo artifacts
        run: pnpm run build
      - name: Install desktop workspace
        run: pnpm -C desktop install --frozen-lockfile
      # notarytool takes the App Store Connect key as a FILE path, so the
      # base64 secret is materialized before packaging. Absent secret leaves
      # notarization to the APPLE_ID strategy, or skips it entirely.
      - name: Stage App Store Connect API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY_B64" ]; then
            echo "no App Store Connect API key configured"
            exit 0
          fi
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization (all optional).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing (optional).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm -C desktop run package -- --skip-build --publish ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'always' || 'never' }}
      # Each macOS leg's feed lists only its own arch. Keep a copy before the
      # other leg's upload overwrites the release asset; merge-mac-feed unions
      # them once the matrix is done.
      - name: Upload macOS update feed
        if: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-feed-${{ matrix.os }}
          path: desktop/out/latest-mac.yml
          if-no-files-found: error
      - name: Upload artifacts (non-release runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
          if-no-files-found: error

  # Both macOS legs publish a latest-mac.yml holding only their own arch, and
  # the GitHub publisher deletes then re-uploads the asset, so whichever leg
  # finishes last wins. Serving an Intel-only feed would silently hand Apple
  # Silicon users the x64 build, so replace the survivor with the union.
  merge-mac-feed:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install desktop workspace
        run: pnpm -C desktop install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-feed-*
          path: mac-feeds
      - name: Merge and publish the macOS feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          feeds=(mac-feeds/*/latest-mac.yml)
          if [ "${#feeds[@]}" -ne 2 ]; then
            echo "expected one feed per macOS leg, found: ${feeds[*]}" >&2
            exit 1
          fi
          pnpm -C desktop run merge:mac-feed "$GITHUB_WORKSPACE/latest-mac.yml" "${feeds[@]/#/$GITHUB_WORKSPACE/}"
          cat latest-mac.yml
          gh release upload "v${GITHUB_REF_NAME#desktop-v}" latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"
